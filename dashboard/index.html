<!doctype html>
<html lang="ar" dir="rtl">
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>لوحة التحكم</title>
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dashboard_theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (error) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #boot-splash {
        --boot-color: #4f46e5;
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        color: #0f172a;
        font-family: Cairo, system-ui, sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      html.dark #boot-splash { background: #0b1220; color: #f1f5f9; }
      #boot-splash.boot-out { opacity: 0; visibility: hidden; pointer-events: none; }
      .boot-stage { display: flex; flex-direction: column; align-items: center; }
      .boot-mark {
        display: flex; align-items: center; justify-content: center;
        width: 64px; height: 64px; border-radius: 18px;
        background: var(--boot-color); color: #fff;
        animation: boot-bounce 1s infinite;
      }
      .boot-mark.has-logo { width: auto; height: auto; border-radius: 0; background: none; }
      .boot-mark img { display: block; max-height: 72px; max-width: 220px; object-fit: contain; }
      html.dark .boot-mark img { filter: brightness(0) invert(1); }
      .boot-shadow {
        width: 46px; height: 8px; margin-top: 12px; border-radius: 50%;
        background: currentColor; opacity: 0.2; animation: boot-shadow 1s infinite;
      }
      .boot-name { margin: 0; font-size: 15px; font-weight: 700; }
      .boot-name:empty { display: none; }
      .boot-bar {
        direction: ltr; width: 120px; height: 3px; border-radius: 3px;
        background: rgba(100, 116, 139, 0.25); overflow: hidden;
      }
      .boot-bar span {
        display: block; width: 40%; height: 100%; border-radius: 3px;
        background: var(--boot-color); animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot-hint {
        margin: 0; max-width: 260px; text-align: center; font-size: 12px;
        color: #64748b; opacity: 0; transition: opacity 0.4s;
      }
      @keyframes boot-bounce {
        0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1); }
        50% { transform: translateY(-20px); animation-timing-function: cubic-bezier(0.55, 0.06, 0.68, 0.19); }
      }
      @keyframes boot-shadow {
        0%, 100% { transform: scaleX(1); opacity: 0.2; }
        50% { transform: scaleX(0.55); opacity: 0.08; }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark, .boot-shadow { animation: none; }
        .boot-bar span { animation-duration: 2.6s; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="جارٍ التحميل">
      <div class="boot-stage">
        <div class="boot-mark" id="boot-mark">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
            <path d="M6 12v5c3 3 9 3 12 0v-5" />
          </svg>
        </div>
        <div class="boot-shadow"></div>
      </div>
      <p class="boot-name" id="boot-name"></p>
      <div class="boot-bar"><span></span></div>
      <p class="boot-hint" id="boot-hint">الخادم يستيقظ الآن، وقد يستغرق ذلك حتى دقيقة.</p>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('boot-splash');
        if (!splash) return;
        try {
          var brand = JSON.parse(localStorage.getItem('dashboard_brand') || 'null') || {};
          if (/^#[0-9a-fA-F]{6}$/.test(brand.color || '')) splash.style.setProperty('--boot-color', brand.color);
          if (brand.name) document.getElementById('boot-name').textContent = brand.name;
          if (/^https:\/\//.test(brand.logo || '')) {
            var img = new Image();
            img.alt = '';
            img.onload = function () {
              var mark = document.getElementById('boot-mark');
              mark.className = 'boot-mark has-logo';
              mark.innerHTML = '';
              mark.appendChild(img);
            };
            img.src = brand.logo;
          }
        } catch (error) {}
        setTimeout(function () {
          var hint = document.getElementById('boot-hint');
          if (hint) hint.style.opacity = '1';
        }, 7000);
        setTimeout(function () {
          var el = document.getElementById('boot-splash');
          if (el) el.className += ' boot-out';
        }, 45000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
